      // Storyboard Splashscreen Sequence (2.5s) -> Spinner
      const STORYBOARD_FRAMES = [
        `<rect x="10" y="10" width="200" height="80" fill="#040104" stroke="#881337" stroke-width="1.4" stroke-dasharray="6 4"/>
         <path d="M55 50 Q110 15 165 50 Q110 85 55 50 Z" fill="#140309" stroke="#e11d48" stroke-width="2"/>
         <circle cx="110" cy="50" r="14" fill="#9f1239"/>
         <circle cx="110" cy="50" r="5" fill="#020103"/>`,
        `<rect x="10" y="10" width="200" height="80" fill="#030106"/>
         <line x1="20" y1="82" x2="200" y2="82" stroke="#581c87" stroke-width="1.5"/>
         <rect x="42" y="34" width="22" height="48" fill="#09030f" stroke="#6b21a8" stroke-width="1.5"/>
         <rect x="74" y="18" width="28" height="64" fill="#120309" stroke="#be123c" stroke-width="1.5"/>
         <rect x="114" y="26" width="24" height="56" fill="#09030f" stroke="#6b21a8" stroke-width="1.5"/>
         <path d="M156 14 L146 46 L160 46 L148 78" fill="none" stroke="#e11d48" stroke-width="2"/>`,
        `<rect x="10" y="10" width="200" height="80" fill="#040103"/>
         <circle cx="110" cy="50" r="34" fill="#110207" stroke="#9f1239" stroke-width="1.6"/>
         <circle cx="110" cy="50" r="20" fill="none" stroke="#6b21a8" stroke-width="1" stroke-dasharray="4 3"/>
         <line x1="65" y1="50" x2="155" y2="50" stroke="#be123c" stroke-width="1.4"/>
         <line x1="110" y1="10" x2="110" y2="90" stroke="#be123c" stroke-width="1.4"/>
         <circle cx="110" cy="50" r="4" fill="#e11d48"/>`
      ];

      let bootElapsed = 0;
      const bootTimer = setInterval(() => {
        bootElapsed += 80;
        const pct = Math.min(100, Math.floor((bootElapsed / 2500) * 100));
        spinnerFill.style.width = `${pct}%`;

        if (bootElapsed < 750) {
          storyboardSvg.innerHTML = STORYBOARD_FRAMES[0];
          spinnerCode.textContent = '01 OF 03';
        } else if (bootElapsed < 1500) {
          storyboardSvg.innerHTML = STORYBOARD_FRAMES[1];
          spinnerCode.textContent = '02 OF 03';
        } else if (bootElapsed < 2100) {
          storyboardSvg.innerHTML = STORYBOARD_FRAMES[2];
          spinnerCode.textContent = '03 OF 03';
        } else {
          document.getElementById('storyboard-frame').style.display = 'none';
          bootSpinner.style.display = 'block';
          spinnerCode.textContent = `SYNC ${pct}%`;
        }

        if (bootElapsed >= 2500) {
          clearInterval(bootTimer);
          splashScreen.style.opacity = '0';
          setTimeout(() => {
            splashScreen.style.display = 'none';
          }, 360);
        }
      }, 80);

      function showTransitionSpinner(label, durationMs, cb) {
        transitionCode.textContent = label || 'LOADING';
        spinnerOverlay.style.display = 'flex';
        setTimeout(() => {
          spinnerOverlay.style.display = 'none';
          if (cb) cb();
        }, durationMs || 240);
      }

      // Device Orientation & Touch Detection
      let activeDeviceIsTouch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window && window.innerWidth <= 1024);

      function enforceLandscapeOnMobile() {
        if (!activeDeviceIsTouch) {
          rotateOverlay.style.display = 'none';
          return;
        }
        const isPortrait = window.innerHeight > window.innerWidth;
        rotateOverlay.style.display = isPortrait ? 'flex' : 'none';
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
      }
      window.addEventListener('resize', enforceLandscapeOnMobile);

      function syncControlModeUI() {
        if (!state.running) {
          touchControls.style.display = 'none';
          lockHint.style.display = 'none';
          return;
        }
        if (activeDeviceIsTouch) {
          touchControls.style.display = 'block';
          lockHint.style.display = 'none';
        } else {
          touchControls.style.display = 'none';
          lockHint.style.display = document.pointerLockElement === canvas ? 'none' : 'block';
        }
      }

      function equipPistol(idx) {
        state.weaponIdx = (idx + PISTOLS.length) % PISTOLS.length;
        const w = PISTOLS[state.weaponIdx];
        state.maxAmmo = w.clip;
        state.ammo = w.clip;
        state.reserveAmmo = w.reserve;
        state.reloading = false;

        gunAccentMat.color.setHex(w.accent);
        muzzleLight.color.setHex(w.accent);
        barrelExtMesh.visible = (w.id === 'MAGNUM' || w.id === 'AUTO-9');
        barrelExtMesh.scale.set(
          w.id === 'MAGNUM' ? 1.2 : 0.9,
          w.id === 'MAGNUM' ? 1.45 : 0.85,
          w.id === 'MAGNUM' ? 1.2 : 0.9
        );
        scopeMountMesh.visible = true;
        scopeLens.material.color.set(w.scopeColor);

        scopeSvg.querySelectorAll('circle, line').forEach((el) => {
          if (el.id !== 'scope-pulse-ring' && el.getAttribute('r') !== '2.4') {
            el.setAttribute('stroke', w.scopeColor);
          }
        });

        btnWeaponSelect.textContent = `PISTOL: ${w.label}`;
        hudGunName.textContent = w.id;
        updateHUD();
      }

      function applyCrosshair(idx) {
        state.crosshairIdx = (idx + CROSSHAIRS.length) % CROSSHAIRS.length;
        const ch = CROSSHAIRS[state.crosshairIdx];
        crosshairSvg.innerHTML = ch.svg;
        btnCrosshairSelect.textContent = `AIM: ${ch.name}`;
      }

      function applyClimate(idx) {
        state.climateIdx = idx % CLIMATES.length;
        const c = CLIMATES[state.climateIdx];
        for (let i = 0; i < tornadoes.length; i++) {
          tornadoes[i].group.visible = i < c.tornadoes;
        }
      }

      function loadStage(num) {
        state.stageNum = ((num - 1) % SCENE_ARCHETYPES.length) + 1;
        const arch = getCurrentArchetype();
        state.themeName = arch.theme;
        state.totalQuota = Math.max(4, Math.round(arch.quota * DIFF().quota));
        state.kills = 0;
        state.hp = 100;
        state.battery = 100;
        playerPos.set(0, 1.68, 0);
        state.yaw = 0;
        state.pitch = 0;

        scene.background = new THREE.Color(arch.fog);
        scene.fog = new THREE.FogExp2(arch.fog, arch.overDark ? 0.068 : 0.032);
        ambientLight.color.setHex(arch.overDark ? 0x050608 : (state.vividVfx ? arch.accent : 0x262e3d));
        ambientLight.intensity = arch.overDark ? 0.16 : 0.72;
        moonLight.intensity = arch.overDark ? 0.12 : 0.55;

        withSeed(MP.active ? MP.seed + state.stageNum * 131 : null, () => {
          generateUniqueScene(arch);
          decorateLevel(arch);
          spawnPickups();
        });
        placeAtSpawn();
        equipPistol(state.weaponIdx);
        applyClimate((state.stageNum - 1) % CLIMATES.length);

        for (let i = 0; i < enemies.length; i++) {
          enemies[i].alive = false;
          enemies[i].root.visible = false;
          enemies[i].respawnTimer = DIFF().grace + i * DIFF().gap;
        }

        for (let i = 0; i < debrisField.length; i++) {
          const d = debrisField[i];
          d.mesh.material.color.setHex(d.isNeonA ? arch.neonA : arch.neonB);
        }

        btnStage.textContent = `SCENE ${state.stageNum} - ${arch.theme}`;
        updateHUD();
      }

      function renderRadarMap() {
        const w = radarCanvas.width;
        const h = radarCanvas.height;
        const cx = w * 0.5;
        const cy = h * 0.5;
        const maxRange = 36;
        const arch = getCurrentArchetype();
        const hexA = `#${new THREE.Color(arch.neonA).getHexString()}`;
        const hexB = `#${new THREE.Color(arch.neonB).getHexString()}`;

        radarWrap.style.borderColor = hexA;
        radarCtx.clearRect(0, 0, w, h);

        radarCtx.strokeStyle = `${hexA}44`;
        radarCtx.lineWidth = 1;
        radarCtx.beginPath();
        radarCtx.arc(cx, cy, cx * 0.45, 0, Math.PI * 2);
        radarCtx.moveTo(cx, 4);
        radarCtx.lineTo(cx, h - 4);
        radarCtx.moveTo(4, cy);
        radarCtx.lineTo(w - 4, cy);
        radarCtx.stroke();

        radarCtx.fillStyle = `${hexA}22`;
        radarCtx.beginPath();
        radarCtx.moveTo(cx, cy);
        radarCtx.arc(cx, cy, cx - 3, -Math.PI * 0.5 - 0.44, -Math.PI * 0.5 + 0.44);
        radarCtx.closePath();
        radarCtx.fill();

        const cosY = Math.cos(state.yaw);
        const sinY = Math.sin(state.yaw);

        // Render Building Footprints on Radar
        radarCtx.fillStyle = `${hexA}38`;
        for (let i = 0; i < colliders.length; i++) {
          const c = colliders[i];
          const dx = c.cx - playerPos.x;
          const dz = c.cz - playerPos.z;
          const rx = (dx * cosY - dz * sinY) / maxRange;
          const rz = (dx * sinY + dz * cosY) / maxRange;
          if (Math.hypot(rx, rz) < 0.88) {
            radarCtx.fillRect(cx + rx * (cx - 6) - 2.5, cy + rz * (cy - 6) - 2.5, 5, 5);
          }
        }

        for (let i = 0; i < pickups.length; i++) {
          const p = pickups[i];
          if (!p.active) continue;
          const dx = p.mesh.position.x - playerPos.x;
          const dz = p.mesh.position.z - playerPos.z;
          const rx = (dx * cosY - dz * sinY) / maxRange;
          const rz = (dx * sinY + dz * cosY) / maxRange;
          if (Math.hypot(rx, rz) <= 0.92) {
            radarCtx.fillStyle = p.type === 'AMMO' ? '#e6a82e' : '#34c759';
            radarCtx.fillRect(cx + rx * (cx - 6) - 1.5, cy + rz * (cy - 6) - 1.5, 3, 3);
          }
        }

        for (let i = 0; i < enemies.length; i++) {
          const en = enemies[i];
          if (!en.alive) continue;
          const dx = en.root.position.x - playerPos.x;
          const dz = en.root.position.z - playerPos.z;
          let rx = (dx * cosY - dz * sinY) / maxRange;
          let rz = (dx * sinY + dz * cosY) / maxRange;
          const d = Math.hypot(rx, rz);
          if (d > 0.9) {
            rx = (rx / d) * 0.9;
            rz = (rz / d) * 0.9;
          }
          radarCtx.fillStyle = en.type === 'BRUTE' ? '#00f5d4' : (en.type === 'WATCHER' ? '#f5d042' : (en.type === 'HOUND' ? '#ff6b00' : (en.type === 'BAT' ? hexB : '#ff2424')));
          radarCtx.beginPath();
          radarCtx.arc(cx + rx * (cx - 6), cy + rz * (cy - 6), en.type === 'BRUTE' ? 4.4 : 3.1, 0, Math.PI * 2);
          radarCtx.fill();
        }

        radarCtx.fillStyle = '#ffffff';
        radarCtx.beginPath();
        radarCtx.moveTo(cx, cy - 4);
        radarCtx.lineTo(cx - 3, cy + 3);
        radarCtx.lineTo(cx + 3, cy + 3);
        radarCtx.closePath();
        radarCtx.fill();
      }

      function updateHUD() {
        hpBar.style.width = `${Math.max(0, Math.min(100, state.hp))}%`;
        hpBar.style.background = state.hp <= 35 ? '#ff1e1e' : '#dc2626';

        batBar.style.width = `${Math.max(0, Math.min(100, state.battery))}%`;
        batBar.style.background = state.battery <= 25 ? '#d92626' : '#eab308';

        hudAmmo.textContent = state.reloading ? 'RELOAD' : `${state.ammo}/${state.reserveAmmo}`;
        for (let i = 0; i < pipEls.length; i++) {
          if (i >= state.maxAmmo) {
            pipEls[i].style.display = 'none';
          } else {
            pipEls[i].style.display = 'block';
            if (i < state.ammo) pipEls[i].classList.remove('spent');
            else pipEls[i].classList.add('spent');
          }
        }
        reloadWarn.style.opacity = (!state.reloading && state.ammo === 0) ? '1' : '0';
      }

      // =========================================================================
      // 10. COMBAT: SHOOTING, RELOAD, SCOPE ZOOM & COLLIDER OCCLUSION
      // =========================================================================
      const raycaster = new THREE.Raycaster();
      const centerNDC = new THREE.Vector2(0, 0);

      function toggleZoom(forceState) {
        if (!state.running) return;
        state.zoomed = typeof forceState === 'boolean' ? forceState : !state.zoomed;
        scopeOverlay.style.opacity = state.zoomed ? '1' : '0';
        crosshairWrap.style.opacity = state.zoomed ? '0' : '1';
        btnAimTouch.classList.toggle('active', state.zoomed);
      }

      function triggerReload() {
        if (state.reloading || state.ammo >= state.maxAmmo || state.reserveAmmo <= 0) return;
        state.reloading = true;
        state.reloadTimer = 1.05;
        if (state.zoomed) toggleZoom(false);
        audio.playReload();
        updateHUD();
      }

      function firePistol() {
        if (!state.running || state.countdown > 0 || state.reloading || state.fireCooldown > 0) return;
        if (state.ammo <= 0) {
          triggerReload();
          return;
        }

        const w = PISTOLS[state.weaponIdx];
        state.ammo--;
        state.fireCooldown = w.cooldown;
        state.recoil = w.recoilKick;
        muzzleLight.intensity = 5.2;
        muzzleFlashGroup.visible = true;
        muzzleFlashGroup.rotation.z = Math.random() * Math.PI;
        flashCore.material.color.setHex(w.accent);
        muzzleFlashTimer = 0.065;

        audio.playGunshot(w.pitch);
        spawnShellCasing();
        updateHUD();

        // Update World Matrices Before Raycasting & Computing Tracer Origin
        playerRig.updateMatrixWorld(true);
        camera.updateMatrixWorld(true);

        crosshairWrap.style.transform = 'translate(-50%, -50%) scale(1.38)';
        setTimeout(() => {
          crosshairWrap.style.transform = 'translate(-50%, -50%) scale(1)';
        }, 75);

        if (state.zoomed) {
          scopeSvg.style.transform = 'scale(1.06)';
          scopePulseRing.setAttribute('opacity', '0.95');
          scopePulseRing.setAttribute('r', '14');
          setTimeout(() => {
            scopeSvg.style.transform = 'scale(1)';
            scopePulseRing.setAttribute('opacity', '0');
            scopePulseRing.setAttribute('r', '8');
          }, 90);
        }

        const xrA = renderer.xr.isPresenting ? xrAimSet() : (raycaster.setFromCamera(centerNDC, camera), null);
        const wallHits = raycaster.intersectObjects(obstacleMeshes, true);
        const wallDist = wallHits.length > 0 ? wallHits[0].distance : Infinity;

        const enemyHits = raycaster.intersectObjects(enemyHitboxes, true);
        const startOffset = state.zoomed
          ? new THREE.Vector3(0.0, -0.06, -0.45)
          : new THREE.Vector3(0.18, -0.13, -0.52);
        const startVec = xrA ? xrA.start : startOffset.applyMatrix4(camera.matrixWorld);
        let endVec = xrA ? xrA.end : new THREE.Vector3(0, 0, -42).applyMatrix4(camera.matrixWorld);

        const mpHit = MP.active ? MP.rayPlayers(raycaster, wallDist, w.damage) : null;
        let hitEnemy = null;
        let hitPoint = null;
        let isHeadshot = false;
        for (let i = 0; i < enemyHits.length; i++) {
          const candidate = enemyHits[i];
          if (candidate.distance >= wallDist) break;
          const en = candidate.object.userData.enemyRef;
          if (en && en.alive) {
            hitEnemy = en;
            hitPoint = candidate.point;
            const relY = hitPoint.y - en.root.position.y;
            isHeadshot = !!candidate.object.userData.isHead || (relY >= (en.type === 'BRUTE' ? 2.2 : (en.type === 'HOUND' ? 0.62 : 1.52)));
            break;
          }
        }

        if (mpHit) {
          endVec = mpHit;
          spawnBurst(mpHit, 8, 0xdc2626);
          hitmarker.style.opacity = '1';
          setTimeout(() => { hitmarker.style.opacity = '0'; }, 95);
        } else if (hitEnemy && hitPoint) {
          endVec = hitPoint;
          const actualDmg = isHeadshot ? Math.round(w.damage * 2.5) : w.damage;
          hitEnemy.hp -= actualDmg;
          hitEnemy.hitFlash = 0.12;
          spawnBurst(hitPoint, isHeadshot ? 8 : 4, isHeadshot ? 0xff0033 : 0xdc2626);
          fxHit(hitEnemy, hitPoint, actualDmg, isHeadshot);
          hitmarker.style.opacity = '1';
          hitmarker.style.transform = isHeadshot ? 'translate(-50%, -50%) scale(1.4)' : 'translate(-50%, -50%) scale(1.12)';
          setTimeout(() => {
            hitmarker.style.opacity = '0';
            hitmarker.style.transform = 'translate(-50%, -50%) scale(0.65)';
          }, 95);

          if (hitEnemy.hp <= 0) {
            hitEnemy.alive = false;
            fxKill(hitEnemy, hitPoint);
            hitEnemy.respawnTimer = DIFF().respawn[0] + Math.random() * (DIFF().respawn[1] - DIFF().respawn[0]);
            state.kills++;
            spawnBurst(hitPoint, isHeadshot ? 22 : 14, isHeadshot ? 0xff0033 : getCurrentArchetype().neonB);

            if (state.kills >= state.totalQuota && !MP.active) {
              const nextScene = (state.stageNum % SCENE_ARCHETYPES.length) + 1;
              showTransitionSpinner(`SCENE ${nextScene}`, 320, () => {
                loadStage(nextScene);
              });
            }
          }
        } else if (wallHits.length > 0) {
          endVec = wallHits[0].point;
          spawnBurst(endVec, 5, w.accent);
        }

        spawnBulletTracer(startVec, endVec, w.accent);
        if (MP.active) sendAll({ t: 'f', id: MP.me.id, a: startVec.x, b: startVec.y, c: startVec.z, d: endVec.x, e: endVec.y, f: endVec.z });
      }

      // =========================================================================
      // 11. INPUT HANDLING (KEYBOARD, MOUSE LOCK/DRAG, TOUCH JOYSTICK & BUTTONS)
      // =========================================================================
      const keys = {};
      let mouseDragging = false;
      let touchFireHeld = false;
      let touchCrankHeld = false;

      window.addEventListener('keydown', (e) => {
        activeDeviceIsTouch = false;
        syncControlModeUI();
        keys[e.code] = true;

        if (e.code === 'Escape' && state.running) {
          showTransitionSpinner('PAUSED', 160, () => openMenu('PAUSED', 'RESUME', true));
        }
        if (!state.running) return;
        if (e.code === 'KeyR') triggerReload();
        if (e.code === 'KeyZ') toggleZoom();
        if (e.code === 'Digit1') equipPistol(0);
        if (e.code === 'Digit2') equipPistol(1);
        if (e.code === 'Digit3') equipPistol(2);
        if (e.code === 'Space') {
          state.jumpBufferTimer = 0.16;
        }
      });

      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      canvas.addEventListener('mousedown', (e) => {
        if (activeDeviceIsTouch || !state.running) return;
        if (e.button === 2) {
          toggleZoom();
          return;
        }
        if (e.button !== 0) return;
        if (document.pointerLockElement !== canvas && canvas.requestPointerLock) {
          try {
            const p = canvas.requestPointerLock();
            if (p && p.catch) p.catch(() => {});
          } catch (_) {}
        }
        mouseDragging = true;
        firePistol();
      });

      window.addEventListener('mouseup', () => {
        mouseDragging = false;
      });

      window.addEventListener('contextmenu', (e) => e.preventDefault());

      document.addEventListener('pointerlockchange', syncControlModeUI);

      window.addEventListener('mousemove', (e) => {
        if (!state.running || activeDeviceIsTouch) return;
        if (document.pointerLockElement === canvas || mouseDragging) {
          const sens = 0.0022 * state.lookSens * (state.zoomed ? 0.55 : 1.0);
          state.yaw -= e.movementX * sens;
          state.pitch = Math.max(-1.15, Math.min(1.15, state.pitch - e.movementY * sens));
        }
      });

      // Touch Joystick (Floating Dynamic Surface) & Right-Side Look Pan
      const joyZone = document.getElementById('joy-zone');
      const joyKnob = document.getElementById('joy-knob');
      const joySurface = document.getElementById('joy-surface');
      const lookZone = document.getElementById('look-zone');
      const touchActionsWrap = document.querySelector('.touch-actions');
      let joyTouchId = null;
      let joyVec = { x: 0, y: 0 };
      let joyBaseX = 0;
      let joyBaseY = 0;
      let lookTouchId = null;
      let lastLookX = 0;
      let lastLookY = 0;

      function isTouchOverActionButtons(touch) {
        if (!touchActionsWrap) return false;
        const r = touchActionsWrap.getBoundingClientRect();
        return touch.clientX >= (r.left - 24) && touch.clientY >= (r.top - 24);
      }

      function onJoyTouchStart(e) {
        activeDeviceIsTouch = true;
        syncControlModeUI();
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (joyTouchId === null) {
            joyTouchId = t.identifier;
            joyBaseX = t.clientX;
            joyBaseY = t.clientY;
            joyZone.style.left = `${t.clientX - 62}px`;
            joyZone.style.top = `${t.clientY - 62}px`;
            joyZone.style.bottom = 'auto';
            joyZone.style.opacity = '0.9';
            updateJoystick(t);
            break;
          }
        }
      }

      function onJoyTouchMove(e) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === joyTouchId) {
            updateJoystick(e.changedTouches[i]);
          }
        }
      }

      function resetJoystick(e) {
        if (e && e.changedTouches) {
          let found = false;
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joyTouchId) found = true;
          }
          if (!found) return;
        }
        joyTouchId = null;
        joyVec.x = 0;
        joyVec.y = 0;
        joyKnob.style.transform = 'translate(0px, 0px)';
        joyZone.style.left = '';
        joyZone.style.top = '';
        joyZone.style.bottom = 'max(18px, env(safe-area-inset-bottom, 18px))';
        joyZone.style.opacity = '0.45';
      }

      if (joySurface) {
        joySurface.addEventListener('touchstart', onJoyTouchStart, { passive: false });
        joySurface.addEventListener('touchmove', onJoyTouchMove, { passive: false });
        joySurface.addEventListener('touchend', resetJoystick);
        joySurface.addEventListener('touchcancel', resetJoystick);
      }
      joyZone.addEventListener('touchstart', onJoyTouchStart, { passive: false });
      joyZone.addEventListener('touchmove', onJoyTouchMove, { passive: false });
      joyZone.addEventListener('touchend', resetJoystick);
      joyZone.addEventListener('touchcancel', resetJoystick);

      function updateJoystick(touch) {
        const cx = joyBaseX || (joyZone.getBoundingClientRect().left + 62);
        const cy = joyBaseY || (joyZone.getBoundingClientRect().top + 62);
        const maxR = 52;
        let dx = touch.clientX - cx;
        let dy = touch.clientY - cy;
        const d = Math.hypot(dx, dy);
        if (d > maxR) {
          dx = (dx / d) * maxR;
          dy = (dy / d) * maxR;
        }
        joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        joyVec.x = (dx / maxR) * state.joySens;
        joyVec.y = (dy / maxR) * state.joySens;
      }

      lookZone.addEventListener('touchstart', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (isTouchOverActionButtons(t)) continue;
          if (lookTouchId === null) {
            lookTouchId = t.identifier;
            lastLookX = t.clientX;
            lastLookY = t.clientY;
            break;
          }
        }
      }, { passive: false });

      lookZone.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === lookTouchId) {
            const dx = t.clientX - lastLookX;
            const dy = t.clientY - lastLookY;
            lastLookX = t.clientX;
            lastLookY = t.clientY;
            const sens = 0.0044 * state.lookSens * (state.zoomed ? 0.55 : 1.0);
            state.yaw -= dx * sens;
            state.pitch = Math.max(-1.1, Math.min(1.1, state.pitch - dy * sens));
          }
        }
      }, { passive: false });

      function onLookTouchEnd(e) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === lookTouchId) {
            lookTouchId = null;
            break;
          }
        }
      }
      lookZone.addEventListener('touchend', onLookTouchEnd);
      lookZone.addEventListener('touchcancel', onLookTouchEnd);

      // Touch Action Icon Buttons
      document.getElementById('btn-fire').addEventListener('touchstart', (e) => {
        e.preventDefault();
        touchFireHeld = true;
        firePistol();
      });
      document.getElementById('btn-fire').addEventListener('touchend', () => {
        touchFireHeld = false;
      });
      document.getElementById('btn-reload').addEventListener('touchstart', (e) => {
        e.preventDefault();
        triggerReload();
      });
      btnAimTouch.addEventListener('touchstart', (e) => {
        e.preventDefault();
        toggleZoom();
      });
      document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
        e.preventDefault();
        state.jumpBufferTimer = 0.16;
      });
      document.getElementById('btn-crank').addEventListener('touchstart', (e) => {
        e.preventDefault();
        touchCrankHeld = true;
      });
      document.getElementById('btn-crank').addEventListener('touchend', () => {
        touchCrankHeld = false;
      });

      // =========================================================================
      // 12. MENU, PAUSE, SETUP & VR MODE HANDLERS
      // =========================================================================
      function openMenu(statusText, playLabel, isPauseOrEnd = false) {
        state.running = false;
        state.countdown = 0;
        state.zoomed = false;
        scopeOverlay.style.opacity = '0';
        crosshairWrap.style.opacity = '1';
        btnAimTouch.classList.remove('active');
        countdownOverlay.style.display = 'none';
        menuStatus.textContent = statusText || '';
        btnPlay.textContent = playLabel || 'START';
        btnMainMenu.style.display = isPauseOrEnd ? 'block' : 'none';
        btnExit.style.display = isPauseOrEnd ? 'block' : 'none';
        mainMenuStack.style.display = 'flex';
        settingsPanel.style.display = 'none';
        menuOverlay.style.display = 'flex';
        hudEl.style.display = 'none';
        touchControls.style.display = 'none';
        audio.setAmbience(0.01, 0.01, 0.02);
        if (document.pointerLockElement === canvas && document.exitPointerLock) {
          document.exitPointerLock();
        }
        if (renderer.xr && renderer.xr.isPresenting && typeof vrUI !== 'undefined') {
          vrUI.show(statusText || 'OPERATIONS PAUSED');
        }
      }

      function startGame() {
        audio.resume();
        enforceLandscapeOnMobile();

        const needFreshStage = (state.hp <= 0 || state.kills >= state.totalQuota);
        showTransitionSpinner('SYNCING', 240, () => {
          if (needFreshStage) {
            loadStage(state.stageNum);
          }
          state.running = true;
          state.countdown = 3.0;
          countdownNum.textContent = '3';
          countdownOverlay.style.display = 'flex';
          audio.playCountdownTick(3);

          menuOverlay.style.display = 'none';
          hudEl.style.display = 'block';
          syncControlModeUI();

          if (renderer.xr && renderer.xr.isPresenting && typeof vrUI !== 'undefined') {
            vrUI.hide();
          }

          if (!activeDeviceIsTouch && canvas.requestPointerLock) {
            try {
              const p = canvas.requestPointerLock();
              if (p && p.catch) p.catch(() => {});
            } catch (_) {}
          }
        });
      }

      btnPlay.addEventListener('click', startGame);

      btnHudPause.addEventListener('click', () => {
        if (!state.running) return;
        showTransitionSpinner('PAUSED', 180, () => {
          openMenu('PAUSED', 'RESUME', true);
        });
      });

      btnMainMenu.addEventListener('click', () => {
        showTransitionSpinner('MENU', 200, () => {
          loadStage(state.stageNum);
          openMenu('', 'START', false);
        });
      });

      btnExit.addEventListener('click', () => {

          openMenu('', 'START', false);
        });
      });

      btnStage.addEventListener('click', () => {
        audio.resume();
        const nextStage = (state.stageNum % SCENE_ARCHETYPES.length) + 1;
        showTransitionSpinner(`SCENE ${nextStage}`, 180, () => {

      btnSettings.addEventListener('click', () => {

      btnSettingsBack.addEventListener('click', () => {

        mainMenuStack.style.display = 'flex';
      });

      btnWeaponSelect.addEventListener('click', () => equipPistol(state.weaponIdx + 1));
      btnCrosshairSelect.addEventListener('click', () => applyCrosshair(state.crosshairIdx + 1));

      btnVfxSelect.addEventListener('click', () => {

        btnVfxSelect.textContent = state.vividVfx ? 'VFX: VIVID' : 'VFX: CLASSIC';
        loadStage(state.stageNum);

      const btnRenderScale = document.getElementById('btn-render-scale');
      if (btnRenderScale) {
        btnRenderScale.textContent = `RES: ${state.renderMode}`;
        btnRenderScale.addEventListener('click', () => {
          state.renderMode = state.renderMode === 'RETRO' ? 'NATIVE' : 'RETRO';
          try { localStorage.setItem('dread98-res', state.renderMode); } catch (_) {}
          btnRenderScale.textContent = `RES: ${state.renderMode}`;
          updateRendererSize();
        });
      }

      btnAudio.addEventListener('click', () => {
        audio.enabled = !audio.enabled;
        btnAudio.textContent = audio.enabled ? 'SOUND: ON' : 'SOUND: OFF';
        if (!audio.enabled) audio.setAmbience(0, 0, 0);
      });

      const sliderLook = document.getElementById('slider-look');
      const sliderJoy = document.getElementById('slider-joy');
      const sliderBtn = document.getElementById('slider-btn');
      sliderLook.addEventListener('input', () => {
        state.lookSens = parseFloat(sliderLook.value);
        document.getElementById('val-look').textContent = state.lookSens.toFixed(1);
      });
      sliderJoy.addEventListener('input', () => {
        state.joySens = parseFloat(sliderJoy.value);
        document.getElementById('val-joy').textContent = state.joySens.toFixed(1);
      });
      sliderBtn.addEventListener('input', () => {

      let deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {

      });
      btnPwaSettings.addEventListener('click', async () => {
        if (deferredPwaPrompt) {

        } else {
          btnPwaSettings.textContent = 'READY FOR PWA';
        }
      });

      // Native Quest 2 / Quest 3 WebXR Session Handler (Without Breaking 2D Viewport)
      btnVrMode.addEventListener('click', async () => {
        if (navigator.xr && navigator.xr.isSessionSupported) {
          try {
            const supported = await navigator.xr.isSessionSupported('immersive-vr');
            if (supported) {
              const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local', 'local-floor'] });
              session.addEventListener('end', () => {
                btnVrMode.textContent = 'QUEST VR';
                updateRendererSize();
              });
              renderer.xr.setReferenceSpaceType('local');
              renderer.xr.setFramebufferScaleFactor(0.85);
              await renderer.xr.setSession(session);
              btnVrMode.textContent = 'VR ACTIVE';
              return;
            }
          } catch (_) {}
        }
        btnVrMode.textContent = 'QUEST VR ONLY';
        setTimeout(() => {
          btnVrMode.textContent = 'QUEST VR';
        }, 1600);
      });

      // =========================================================================
      // 13. MAIN 60FPS SIMULATION & RENDER LOOP
      // =========================================================================
      const clock = new THREE.Clock();

      function updateSimulation(dt) {
        const clim = CLIMATES[state.climateIdx];

        // 1. Weather: Angled 3D Rain + Ground Splash Rings + Wind + Ground-Hitting Debris
        const rArr = rainGeo.attributes.position.array;
        for (let i = 0; i < RAIN_COUNT; i++) {
          const idx = i * 6;
          rArr[idx] += clim.windX * dt;
          rArr[idx + 1] -= 21.0 * dt;
          rArr[idx + 2] += clim.windZ * dt;
          if (rArr[idx + 1] < 0) {
            rArr[idx] = playerPos.x + (Math.random() - 0.5) * 52;
            rArr[idx + 1] = 20 + Math.random() * 6;
            rArr[idx + 2] = playerPos.z + (Math.random() - 0.5) * 52;
          }
          rArr[idx + 3] = rArr[idx] - clim.windX * 0.06;
          rArr[idx + 4] = rArr[idx + 1] - 1.25;
          rArr[idx + 5] = rArr[idx + 2] - clim.windZ * 0.06;
        }
        rainGeo.attributes.position.needsUpdate = true;

        for (let i = 0; i < splashRings.length; i++) {
          const sr = splashRings[i];
          sr.phase += dt * 2.8;
          if (sr.phase >= 1.0) {
            sr.phase = 0;
            sr.mesh.position.x = playerPos.x + (Math.random() - 0.5) * 28;
            sr.mesh.position.z = playerPos.z + (Math.random() - 0.5) * 28;
          }
          const s = 0.4 + sr.phase * 1.4;
          sr.mesh.scale.set(s, s, 1);
          sr.mesh.material.opacity = (1.0 - sr.phase) * 0.55;
        }

        const wArr = windGeo.attributes.position.array;
        for (let i = 0; i < WIND_COUNT; i++) {
          const idx = i * 6;
          wArr[idx] += clim.windX * 3.2 * dt;
          wArr[idx + 2] += clim.windZ * 3.2 * dt;
          if (Math.abs(wArr[idx] - playerPos.x) > 28) wArr[idx] = playerPos.x - Math.sign(clim.windX || 1) * 26;
          if (Math.abs(wArr[idx + 2] - playerPos.z) > 28) wArr[idx + 2] = playerPos.z - Math.sign(clim.windZ || 1) * 26;
          wArr[idx + 3] = wArr[idx] + clim.windX * 0.45;
          wArr[idx + 4] = wArr[idx + 1];
          wArr[idx + 5] = wArr[idx + 2] + clim.windZ * 0.45;
        }
        windGeo.attributes.position.needsUpdate = true;

        // Ground-Hitting Debris Physics with Bounce & Impact Spark/Dust Burst
        for (let i = 0; i < debrisField.length; i++) {
          const d = debrisField[i];
          d.phase += dt * d.speed * 2.5;
          d.vy -= 9.8 * dt;
          d.mesh.position.x += (clim.windX * 1.45 + Math.cos(d.phase) * 0.7) * dt;
          d.mesh.position.z += (clim.windZ * 1.45 + Math.sin(d.phase) * 0.7) * dt;
          d.mesh.position.y += d.vy * dt;
          d.mesh.rotation.x += 3.2 * dt;
          d.mesh.rotation.y += 3.6 * dt;

          if (d.mesh.position.y <= 0.06) {
            d.mesh.position.y = 0.06;
            if (Math.abs(d.vy) > 2.2) {
              spawnBurst(d.mesh.position, 2, d.mesh.material.color.getHex());
            }
            d.vy = Math.abs(d.vy) * 0.42 + (clim.tornadoes > 0 ? 3.2 : 0.8);
          }

          if (Math.abs(d.mesh.position.x - playerPos.x) > 24 || Math.abs(d.mesh.position.z - playerPos.z) > 24) {
            d.mesh.position.x = playerPos.x + (Math.random() - 0.5) * 42;
            d.mesh.position.z = playerPos.z + (Math.random() - 0.5) * 42;
            d.mesh.position.y = 5.0 + Math.random() * 6.0;
            d.vy = -1.0;
          }
        }

        // Sway Trees & Flicker Streetlamps
        const elapsed = clock.elapsedTime;
        for (let i = 0; i < swayProps.length; i++) {
          const sp = swayProps[i];
          sp.mesh.rotation.z = Math.sin(elapsed * 2.2 + sp.phase) * sp.factor;
        }
        for (let i = 0; i < flickeringLights.length; i++) {
          const fl = flickeringLights[i];
          fl.light.intensity = 1.6 + Math.sin(elapsed * 14 + fl.phase) * 0.45;
        }

        // Tornado Orbit
        for (let i = 0; i < tornadoes.length; i++) {
          const tor = tornadoes[i];
          if (!tor.group.visible) continue;
          tor.angle += dt * 0.35;
          tor.group.position.x = Math.cos(tor.angle) * tor.radius;
          tor.group.position.z = Math.sin(tor.angle) * tor.radius;
          tor.group.rotation.y += dt * 5.5;
        }

        // Shell Casings, Burst Particles & Bullet Tracers
        for (let i = 0; i < shells.length; i++) {
          const s = shells[i];
          if (s.life > 0) {
            s.life -= dt;
            s.vy -= 9.8 * dt;
            s.mesh.position.x += s.vx * dt;
            s.mesh.position.y += s.vy * dt;
            s.mesh.position.z += s.vz * dt;
            s.mesh.rotation.x += 12 * dt;
            if (s.life <= 0) s.mesh.visible = false;
          }
        }
        for (let i = 0; i < burstPool.length; i++) {
          const p = burstPool[i];
          if (p.life > 0) {
            p.life -= dt;
            p.vy -= 9.5 * dt;
            p.mesh.position.x += p.vx * dt;
            p.mesh.position.y += p.vy * dt;
            p.mesh.position.z += p.vz * dt;
            if (p.life <= 0) p.mesh.visible = false;
          }
        }
        for (let i = 0; i < tracerBolts.length; i++) {
          const t = tracerBolts[i];
          if (t.life > 0) {
            t.life -= dt;
            t.mesh.material.opacity = Math.max(0, (t.life / t.maxLife) * 0.95);
            if (t.life <= 0) t.mesh.visible = false;
          }
        }
        if (muzzleFlashTimer > 0) {
          muzzleFlashTimer -= dt;
          if (muzzleFlashTimer <= 0) muzzleFlashGroup.visible = false;
        }

        if (!state.running) return;

        // 2. 3-2-1 Darkness Countdown
        if (state.countdown > 0) {
          const prevCeil = Math.ceil(state.countdown);
          state.countdown -= dt;
          const curCeil = Math.ceil(state.countdown);
          if (curCeil !== prevCeil && curCeil >= 1) {
            countdownNum.textContent = String(curCeil);
            audio.playCountdownTick(curCeil);
          }
          if (state.countdown <= 0) {
            countdownOverlay.style.display = 'none';
          }
        }

        // Random Climate Shifts & Lightning Thunderstorms
        state.climateTimer -= dt;
        if (state.climateTimer <= 0) {
          state.climateTimer = 18 + Math.random() * 12;
          applyClimate(state.climateIdx + 1);
        }

        state.lightningTimer -= dt;
        if (state.lightningTimer <= 0) {
          state.lightningTimer = 4.5 + Math.random() * 6.5;
          const bx = playerPos.x + (Math.random() - 0.5) * 48;
          const bz = playerPos.z + (Math.random() - 0.5) * 48;
          const bArr = lightningBolt.geometry.attributes.position.array;
          for (let j = 0; j < 10; j++) {
            bArr[j * 3] = bx + (Math.random() - 0.5) * 2.5;
            bArr[j * 3 + 1] = j * 3.2;
            bArr[j * 3 + 2] = bz + (Math.random() - 0.5) * 2.5;
          }
          lightningBolt.geometry.attributes.position.needsUpdate = true;
          lightningBolt.visible = true;
          flashOverlay.style.opacity = '0.65';
          audio.playSpatialThunder(bx, bz);
          setTimeout(() => {
            lightningBolt.visible = false;
            flashOverlay.style.opacity = '0';
          }, 110);
        }

        // 3. Player Movement, Jump Physics & Solid AABB Collider Resolution
        if (keys['KeyQ']) state.yaw += 1.9 * dt * state.lookSens;
        if (keys['KeyE']) state.yaw -= 1.9 * dt * state.lookSens;

        let moveForward = (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0) - joyVec.y;
        let moveRight = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0) + joyVec.x;
        const mLen = Math.hypot(moveForward, moveRight);
        if (mLen > 1) {
          moveForward /= mLen;
          moveRight /= mLen;
        }

        const speed = state.zoomed ? 4.2 : 6.4;
        const sinY = Math.sin(state.yaw);
        const cosY = Math.cos(state.yaw);
        const targetVx = (-sinY * moveForward + cosY * moveRight) * speed;
        const targetVz = (-cosY * moveForward - sinY * moveRight) * speed;

        // Grounded momentum acceleration & deceleration
        const accel = state.onGround ? 16.0 : 8.0;
        state.currentVx += (targetVx - state.currentVx) * Math.min(1.0, accel * dt);
        state.currentVz += (targetVz - state.currentVz) * Math.min(1.0, accel * dt);

        playerPos.x += state.currentVx * dt;
        playerPos.z += state.currentVz * dt;
        resolveCircleColliders(playerPos, 0.55);

        // Jump Buffering & Coyote Time
        if (state.onGround) {
          state.coyoteTimer = 0.12;
        } else {
          state.coyoteTimer = Math.max(0, state.coyoteTimer - dt);
        }
        if (state.jumpBufferTimer > 0) {
          state.jumpBufferTimer = Math.max(0, state.jumpBufferTimer - dt);
          if (state.coyoteTimer > 0) {
            state.vy = 5.8;
            state.onGround = false;
            state.coyoteTimer = 0;
            state.jumpBufferTimer = 0;
          }
        }

        state.vy -= 15.5 * dt;
        playerPos.y += state.vy * dt;
        if (playerPos.y <= 1.68) {
          playerPos.y = 1.68;
          state.vy = 0;
          state.onGround = true;
        }

        const actualSpeed = Math.hypot(state.currentVx, state.currentVz);
        if (actualSpeed > 0.4 && state.onGround) {
          state.bobTime += dt * 10.5;
          state.stepAccum += dt;
          if (state.stepAccum >= 0.42) {
            state.stepAccum = 0;
            audio.playFootstep();
          }
        }

        // Battery Drain & Hand-Crank Recharge
        if (keys['KeyF'] || touchCrankHeld) {
          state.battery = Math.min(100, state.battery + 28 * dt * state.btnSens);
        } else {
          state.battery = Math.max(8, state.battery - 1.35 * dt);
        }
        flashLight.intensity = (state.battery / 100) * 2.6;

        // Reload & Automatic Fire Hold
        if (state.fireCooldown > 0) state.fireCooldown -= dt;
        if ((touchFireHeld || mouseDragging) && PISTOLS[state.weaponIdx].id === 'AUTO-9') {
          firePistol();
        }
        if (state.reloading) {
          state.reloadTimer -= dt;
          if (state.reloadTimer <= 0) {
            const needed = state.maxAmmo - state.ammo;
            const take = Math.min(needed, state.reserveAmmo);
            state.ammo += take;
            state.reserveAmmo -= take;
            state.reloading = false;
            updateHUD();
          }
        }

        // Smooth FOV Scope Zoom & Viewmodel Recoil
        const targetFov = state.zoomed ? PISTOLS[state.weaponIdx].zoomFov : 74;
        camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 14);
        camera.updateProjectionMatrix();

        state.recoil = Math.max(0, state.recoil - dt * 2.2);
        if (muzzleLight.intensity > 0) muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt * 38);

        const targetGunX = state.zoomed ? 0.0 : 0.22;
        const targetGunY = state.zoomed ? -0.145 : -0.22;
        gunGroup.position.x += (targetGunX - gunGroup.position.x) * Math.min(1, dt * 14);
        gunGroup.position.y += (targetGunY - gunGroup.position.y) * Math.min(1, dt * 14);
        gunGroup.position.z = -0.42 + state.recoil * 0.14;
        slideMesh.position.z = -0.02 + state.recoil * 0.08;

        const bobOffsetY = Math.sin(state.bobTime) * 0.055;
        const bobOffsetX = Math.cos(state.bobTime * 0.5) * 0.032;
        const shakeX = state.screenShake > 0 ? (Math.random() - 0.5) * state.screenShake : 0;
        const shakeY = state.screenShake > 0 ? (Math.random() - 0.5) * state.screenShake : 0;
        if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - dt * 0.3);

        playerRig.position.set(
          playerPos.x + bobOffsetX + shakeX,
          playerPos.y + bobOffsetY + shakeY,
          playerPos.z
        );
        if (!renderer.xr.isPresenting) {
          camera.position.set(0, 0, 0);
          camera.rotation.order = 'YXZ';
          camera.rotation.y = state.yaw;
          camera.rotation.x = state.pitch + state.recoil * 0.055;
        } else {
          xrUpdate(dt);
        }

        audio.updateListener(playerPos, state.yaw);
        audio.setAmbience(0.05 * clim.rain, 0.04, 0.05);

        // 4. Pickups Collection
        for (let i = 0; i < pickups.length; i++) {
          const p = pickups[i];
          if (!p.active) {
            p.respawnTimer -= dt;
            if (p.respawnTimer <= 0) {
              p.active = true;
              p.mesh.visible = true;
            }
            continue;
          }
          p.mesh.rotation.y += dt * 1.8;
          if (Math.hypot(p.mesh.position.x - playerPos.x, p.mesh.position.z - playerPos.z) < 1.35) {
            p.active = false;
            p.mesh.visible = false;
            p.respawnTimer = 14;
            if (p.type === 'AMMO') {
              state.reserveAmmo += state.maxAmmo * 2;
            } else {
              state.battery = 100;
              state.hp = Math.min(100, state.hp + 25);
            }
            audio.playReload();
            updateHUD();
          }
        }

        // 5. Stalker AI, Weeping-Angel Freeze, Spatial Footsteps & Directional Damage
        let nearestDist = 999;
        const lookDirX = -Math.sin(state.yaw);
        const lookDirZ = -Math.cos(state.yaw);

        for (let i = 0; i < enemies.length; i++) {
          const en = enemies[i];
          if (!en.alive) {
            if (state.countdown <= 0 && !MP.noAI) {
              en.respawnTimer -= dt;
              if (en.respawnTimer <= 0) { if (aliveCount() < maxAlive()) spawnEnemyAtPerimeter(en); else en.respawnTimer = 1.0; }
            }
            continue;
          }

          const dx = playerPos.x - en.root.position.x;
          const dz = playerPos.z - en.root.position.z;
          const dist = Math.hypot(dx, dz);
          if (dist < nearestDist) nearestDist = dist;

          en.root.lookAt(playerPos.x, en.root.position.y, playerPos.z);

          // Weeping-Angel Watcher freezes when inside player's flashlight beam
          let frozen = false;
          if (en.type === 'WATCHER' && state.battery > 12) {
            const toEnX = -dx / (dist || 1);
            const toEnZ = -dz / (dist || 1);
            const dot = lookDirX * toEnX + lookDirZ * toEnZ;
            if (dot > 0.82 && dist < 28) frozen = true;
          }

          if (!frozen && state.countdown <= 0) {
            en.root.position.x += (dx / (dist || 1)) * en.speed * dt;
            en.root.position.z += (dz / (dist || 1)) * en.speed * dt;
            en.walkPhase += dt * en.speed * 3.1;

            if (en.type !== 'BAT') {
              resolveCircleColliders(en.root.position, en.type === 'BRUTE' ? 0.72 : 0.45);
              const swing = Math.sin(en.walkPhase) * 0.55;
              if (en.animParts.legL) en.animParts.legL.rotation.x = swing;
              if (en.animParts.legR) en.animParts.legR.rotation.x = -swing;

        camera.getWorldDirection(_dv); const p = en.root.position;
        bloodBurst(pt, isHead ? 16 : (8 + Math.min(14, Math.round(dmg / 7))), isHead ? 7 : 5, _dv);
        sfxLib.play('flesh', { x: pt.x, y: pt.y, z: pt.z, vol: isHead ? 1.0 : 0.8, rate: isHead ? 1.25 : 1.0 });
        if (Math.random() < 0.55) sfxLib.play(en.type === 'BRUTE' ? 'bIdle' : 'zHurt', { x: p.x, y: 1.5, z: p.z, vol: 0.8 });
        if (Math.random() < (isHead ? 0.75 : 0.35)) sfxLib.play('blood', { x: pt.x, y: pt.y, z: pt.z, vol: isHead ? 0.85 : 0.6 });
      }
      function fxKill(en, pt) {
        const p = en.root.position; en.dying = 1.6; camera.getWorldDirection(_dv);
        bloodBurst(pt || new THREE.Vector3(p.x, 1.2, p.z), 30, 7.5, _dv);
        bloodDecal(p.x, p.z, 0.9 + Math.random() * 0.5); bloodDecal(p.x + 0.5, p.z - 0.3, 0.45 + Math.random() * 0.3);
        sfxLib.play('fall', { x: p.x, y: 0.3, z: p.z, vol: 0.9 }); sfxLib.play('gory', { x: p.x, y: 1, z: p.z, vol: 0.8 }); sfxLib.play('blood', { x: p.x, y: 1, z: p.z, vol: 0.7 });
      }
      function fxBite(en) {
        const p = en.root.position;
        sfxLib.play('bite', { x: p.x, y: 1.2, z: p.z, vol: 0.9 }); sfxLib.play(en.type === 'BRUTE' ? 'bAttack' : 'zAttack', { x: p.x, y: 1.6, z: p.z, vol: 0.9 });

      }

      // ---- Real zombie models (GLB), loaded lazily, procedural bodies stay as hitboxes / fallback
      const GLB = { ready: false, tried: false, crab: null, slasher: null, applied: false };
      function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
      async function loadGlbModels() {
        if (GLB.tried) return; GLB.tried = true;
        try { await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js'); await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js'); } catch (_) { return; }
        const ld = new THREE.GLTFLoader(); const get = (u) => new Promise((res) => ld.load(u, res, undefined, () => res(null)));
        const r = await Promise.all([get('assets/models/zombie.glb'), get('assets/models/slasher.glb')]);
        r.forEach((g) => { if (g) g.scene.traverse((o) => { if (o.isMesh) { o.frustumCulled = false; if (o.material) { o.material.roughness = 0.8; o.material.metalness = 0.1; if (o.material.emissive) o.material.emissive.setHex(0x1a1010); } } }); });
        GLB.crab = r[0]; GLB.slasher = r[1]; GLB.ready = !!(r[0] || r[1]);
      }
      function applyGlb(en) {
        if (en.glb) return;
        const T = en.type === 'WATCHER' ? (GLB.slasher || GLB.crab) : ((en.type === 'ZOMBIE' || en.type === 'BRUTE') ? (GLB.crab || GLB.slasher) : null); if (!T) return;
        const isCrab = T === GLB.crab, model = THREE.SkeletonUtils.clone(T.scene), holder = new THREE.Group();
        model.scale.setScalar(isCrab ? 0.026 : 1); holder.add(model); holder.scale.setScalar(en.type === 'BRUTE' ? 1.55 : 1);
        if (en.type === 'BRUTE') model.traverse((o) => { if (o.isMesh && o.material) { o.material = o.material.clone(); o.material.color.multiplyScalar(0.55); if (o.material.emissive) o.material.emissive.setHex(0x330000); } });
        const mixer = new THREE.AnimationMixer(model), anims = T.animations || [];
        const walks = isCrab ? anims.filter((a) => a.name.indexOf('walk') >= 0) : [anims[0]];
        const clip = walks[Math.floor(Math.random() * walks.length)] || anims[0]; if (!clip) return;
        const walk = mixer.clipAction(clip); walk.play(); const base = en.type === 'WATCHER' ? 1.4 : (en.type === 'BRUTE' ? 0.8 : 1.0); walk.timeScale = base;
        let atk = null; const ac = isCrab ? anims.find((a) => a.name.indexOf('attack') >= 0) : null;
        if (ac) { atk = mixer.clipAction(ac); atk.setLoop(THREE.LoopOnce, 1); atk.clampWhenFinished = false; mixer.addEventListener('finished', (e) => { if (e.action === atk) { atk.stop(); walk.setEffectiveWeight(1); } }); }
        if (en.visGroup) en.visGroup.visible = false;
        else en.root.children.forEach((c) => { if (c !== en.hitboxGroup) c.visible = false; });
        en.root.add(holder);
        tagEnemyHitMeshes(holder, en);
        en.glb = { holder, mixer, walk, atk, gx: en.root.position.x, gz: en.root.position.z };
      }
      let glbT = 0, cullT = 0;
      const _box = new THREE.Box3(), _sph = new THREE.Sphere();
      function creatureUpdate(dt) {
        if (GLB.ready && !GLB.applied) { GLB.applied = true; enemies.forEach(applyGlb); }
        const px = playerPos.x, pz = playerPos.z;
        for (let i = 0; i < enemies.length; i++) {
          const en = enemies[i], p = en.root.position;
          if (en.alive) {
            const d = Math.hypot(p.x - px, p.z - pz); en.root.visible = d < 75;
            if (en.glb && en.root.visible && d < 48) { const mv = Math.hypot(p.x - en.glb.gx, p.z - en.glb.gz) / Math.max(dt, 1e-3); en.glb.mixer.update(dt * (mv > 0.25 ? 1 : 0.25)); }
            if (en.glb) { en.glb.gx = p.x; en.glb.gz = p.z; }
          } else if (en.dying > 0) {
            en.dying -= dt; const k = Math.min(1, (1 - en.dying / 1.6) * 2.2);
            if (en.type === 'BAT') { p.y = Math.max(0.15, p.y - dt * 5); en.root.rotation.z = k * 2; }
            else if (en.type === 'HOUND') en.root.rotation.z = k * 1.5;
            else { const body = en.glb ? en.glb.holder : (en.visGroup ? en.visGroup : en.root.children[0]); if (body) { body.rotation.x = -k * 1.5; body.position.y = -k * 0.25; } }
            if (en.dying <= 0) { en.root.visible = false; const body = en.glb ? en.glb.holder : (en.visGroup ? en.visGroup : en.root.children[0]); if (body && en.type !== 'BAT' && en.type !== 'HOUND') { body.rotation.x = 0; body.position.y = 0; } }
          }
        }
      }
      function cullUpdate(dt) {
        cullT += dt; if (cullT < 0.3) return; cullT = 0;
        const px = playerPos.x, pz = playerPos.z, kids = envGroup.children;
        for (let i = 0; i < kids.length; i++) {
          const o = kids[i], u = o.userData; if (o.isLight) continue;
          if (u.cr === undefined) { _box.setFromObject(o); if (_box.isEmpty()) { u.cr = -1; continue; } _box.getBoundingSphere(_sph); u.cr = _sph.radius; u.cx = _sph.center.x; u.cz = _sph.center.z; }
          if (u.cr < 0 || u.cr > 14) continue;
          o.visible = Math.hypot(u.cx - px, u.cz - pz) - u.cr < 82;
        }
      }

      // ---- Sky dome: gradient, stars, moon
      const skyGeo = new THREE.SphereGeometry(110, 18, 12); skyGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(skyGeo.attributes.position.count * 3), 3));
      const skyDome = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })); skyDome.renderOrder = -10; skyDome.frustumCulled = false; scene.add(skyDome);
      const starGeo = new THREE.BufferGeometry(), starArr = new Float32Array(300 * 3);
      for (let i = 0; i < 300; i++) { const a = Math.random() * 6.283, e = 0.15 + Math.random() * 1.3, r = 104; starArr[i * 3] = Math.cos(a) * Math.cos(e) * r; starArr[i * 3 + 1] = Math.sin(e) * r; starArr[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r; }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starArr, 3));
      const starPts = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xcfd8ff, size: 1.6, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.8, depthWrite: false })); skyDome.add(starPts);
      const moonDisc = new THREE.Mesh(new THREE.CircleGeometry(6, 24), new THREE.MeshBasicMaterial({ color: 0xdfe8ff, fog: false, depthWrite: false })); moonDisc.position.set(-42, 62, -78); moonDisc.lookAt(0, 0, 0); skyDome.add(moonDisc);
      const moonHalo = new THREE.Mesh(new THREE.CircleGeometry(13, 24), new THREE.MeshBasicMaterial({ color: 0x8fa6d8, fog: false, transparent: true, opacity: 0.14, depthWrite: false })); moonHalo.position.copy(moonDisc.position).multiplyScalar(1.01); moonHalo.lookAt(0, 0, 0); skyDome.add(moonHalo);
      function updateSky(arch) {
        const top = new THREE.Color(arch.overDark ? 0x000000 : 0x03040d), hor = new THREE.Color(arch.fog).multiplyScalar(1.6), c = new THREE.Color();
        const pos = skyGeo.attributes.position, col = skyGeo.attributes.color;
        for (let i = 0; i < pos.count; i++) { const t = Math.max(0, pos.getY(i) / 110); c.copy(hor).lerp(top, Math.pow(t, 0.55)); col.setXYZ(i, c.r, c.g, c.b); }
        col.needsUpdate = true; starPts.visible = !arch.overDark; moonDisc.visible = moonHalo.visible = !arch.overDark; moonDisc.material.color.setHex(0xdfe8ff).lerp(new THREE.Color(arch.neonA), 0.12);
      }

      // ---- Spawn positions (shared by placement and visible pads)
      function spawnPos(i, team, mode) {
        const R = ARENA_RADIUS * 0.6;
        if (mode === 'TEAMS') return { x: (team ? 1 : -1) * R, z: ((i >> 1) - 1.5) * 5 };
        if (mode === 'FFA') { const a = i * Math.PI / 4 + 0.4; return { x: Math.cos(a) * R, z: Math.sin(a) * R }; }
        const a = i * Math.PI / 2; return { x: Math.cos(a) * 5, z: Math.sin(a) * 5 };
      }
      function drawSpawnPads() {
        const padGeo = new THREE.CylinderGeometry(1.3, 1.4, 0.1, 16);
        for (let i = 0; i < 8; i++) {
          const team = MP.mode === 'TEAMS' ? i % 2 : (MP.mode === 'FFA' ? i : 0), sp = spawnPos(i, team, MP.mode);
          const pad = new THREE.Mesh(padGeo, new THREE.MeshBasicMaterial({ color: colFor({ team, idx: i }), transparent: true, opacity: 0.5 })); pad.position.set(sp.x, 0.06, sp.z); envGroup.add(pad);
        }
      }

      // ---- Lobby: names, share code/link, live player list, start only when others joined
      const PEER_OPTS = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } };
      const cleanName = (s) => (s || '').replace(/[^A-Za-z0-9 _-]/g, '').trim().slice(0, 10).toUpperCase();
      const mpName = document.createElement('input'); mpName.maxLength = 10; mpName.placeholder = 'YOUR NAME';
      mpName.style.cssText = mpCode.style.cssText; try { mpName.value = localStorage.getItem('dread98-name') || ''; } catch (_) {}
      mpName.addEventListener('input', () => { try { localStorage.setItem('dread98-name', mpName.value); } catch (_) {} });
      mpPanel.insertBefore(mpName, mpInfo);
      mpInfo.style.whiteSpace = 'pre-line';
      const btnMpShare = mkBtn('SHARE CODE / LINK'); btnMpShare.style.display = 'none'; mpPanel.insertBefore(btnMpShare, btnMpStart);
      btnMpShare.addEventListener('click', async () => {
        const link = location.origin + location.pathname + '?room=' + MP.code, txt = 'Join my DREAD 98 room: ' + MP.code;
        try { if (navigator.share) { await navigator.share({ title: 'DREAD 98', text: txt, url: link }); return; } } catch (_) {}
        try { await navigator.clipboard.writeText(txt + ' ' + link); btnMpShare.textContent = 'COPIED!'; } catch (_) { btnMpShare.textContent = 'CODE: ' + MP.code; }
        setTimeout(() => { btnMpShare.textContent = 'SHARE CODE / LINK'; }, 1800);
      });
      const teamTag = (p) => MP.mode === 'TEAMS' ? (p.team ? ' [BLUE]' : ' [RED]') : '';
      function renderLobby() {
        if (!MP.active) return;
        const ids = Object.keys(MP.players), n = ids.length + 1;
        let t = 'ROOM CODE: ' + (MP.code || '----') + '\nMODE: ' + MP.mode + '    PLAYERS: ' + n + '/8\n\n' + MP.me.name + teamTag(MP.me) + ' (YOU' + (MP.host ? ', HOST' : '') + ')';
        ids.forEach((k) => { t += '\n' + MP.players[k].name + teamTag(MP.players[k]); });
        if (MP.live) t += '\n\nMATCH IN PROGRESS';
        else t += MP.host ? (n < 2 ? '\n\nWAITING FOR PLAYERS TO JOIN...' : '\n\nREADY - PRESS START MATCH') : '\n\nWAITING FOR HOST TO START...';
        mpInfo.textContent = t;
        if (MP.host) { btnMpShare.style.display = 'block'; btnMpStart.disabled = n < 2; btnMpStart.textContent = n < 2 ? 'WAITING FOR PLAYERS...' : 'START MATCH (' + n + ')'; }
      }
      btnMpHost.addEventListener('click', () => { MP.me.name = cleanName(mpName.value) || 'PLAYER 1'; });
      btnMpJoin.addEventListener('click', () => { MP.me.name = cleanName(mpName.value) || 'PLAYER'; });
      btnMpBack.addEventListener('click', () => { btnMpShare.style.display = 'none'; btnMpStart.disabled = false; });
      const roomParam = new URLSearchParams(location.search).get('room');
      if (roomParam) setTimeout(() => { mainMenuStack.style.display = 'none'; mpPanel.style.display = 'flex'; mpCode.value = roomParam.toUpperCase().slice(0, 4); MP.me.name = cleanName(mpName.value) || 'PLAYER'; mpJoin(mpCode.value); }, 900);

      // ---- Updates: version.json check, toast, settings button
      let swReg = null, hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
      const btnUpdate = mkBtn('CHECK FOR UPDATES'), verLabel = document.createElement('div');
      verLabel.style.cssText = 'font-size:0.62rem;letter-spacing:0.14em;color:#6b7280;text-align:center;'; verLabel.textContent = 'VERSION -';
      settingsPanel.insertBefore(btnUpdate, btnPwaSettings); settingsPanel.insertBefore(verLabel, btnPwaSettings);
      const toast = document.createElement('button'); toast.type = 'button';
      toast.style.cssText = 'position:fixed;left:12px;top:12px;z-index:60;display:none;padding:10px 14px;background:rgba(8,10,14,0.92);border:1.5px solid #38bdf8;color:#38bdf8;font:700 0.72rem Courier New;letter-spacing:0.14em;cursor:pointer;';
      document.body.appendChild(toast); toast.addEventListener('click', () => location.reload());
      function showToast(t) { toast.textContent = t; toast.style.display = 'block'; }
      async function hardRefreshCaches() { try { if (swReg) await swReg.update(); const ks = await caches.keys(); for (const k of ks) { if (k.indexOf('code') >= 0) await caches.delete(k); } } catch (_) {} }
      async function checkUpdates(manual) {

          verLabel.textContent = 'VERSION ' + v; localStorage.setItem('dread98-ver', v);
          if (old && old !== v) { if (manual) btnUpdate.textContent = 'UPDATING TO ' + v + '...'; await hardRefreshCaches(); if (manual || !state.running) setTimeout(() => location.reload(), 500); else showToast('UPDATE ' + v + ' READY - TAP TO RELOAD'); return; }
          if (manual) btnUpdate.textContent = 'UP TO DATE (v' + v + ')';
        } catch (_) { if (manual) btnUpdate.textContent = 'OFFLINE - USING SAVED VERSION'; }
        if (manual) setTimeout(() => { btnUpdate.textContent = 'CHECK FOR UPDATES'; }, 2600);
      }
      btnUpdate.addEventListener('click', () => checkUpdates(true));
      window.addEventListener('load', () => setTimeout(() => checkUpdates(false), 1500));
      let lastChk = Date.now();
      document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastChk > 300000) { lastChk = Date.now(); checkUpdates(false); if (swReg) swReg.update().catch(() => {}); } });
      if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController) { hadController = true; return; } if (!state.running) location.reload(); else showToast('NEW VERSION READY - TAP TO RELOAD'); });
      window.addEventListener('load', () => setTimeout(loadGlbModels, 1200));

      // ---- Per-frame hook for this pack
      function pack3Update(dt) {
        bloodUpdate(dt); creatureUpdate(dt); cullUpdate(dt);
        skyDome.position.set(playerPos.x, 0, playerPos.z);
      }


      window.addEventListener('load', () => {
        equipPistol(0);
        applyCrosshair(0);
        loadStage(1);
        enforceLandscapeOnMobile();
        openMenu('', 'START', false);
        renderer.setAnimationLoop(renderSceneFrame);
      });
    })();
